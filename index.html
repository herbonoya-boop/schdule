.login::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.53);z-index:0;pointer-events:none}
.login .card{position:relative;z-index:1;box-shadow:0 20px 80px #0006}
#lg-ms{display:none!important}

/* 날짜 클릭으로 새 업무 생성 */
.calw .dc[data-n]{cursor:pointer}.calw .dc[data-n]:hover{background:#f0edff}.calw .dc[data-n] .dn span:hover{color:#5949bc}

/* Responsive phone and tablet experience */
/* Keep the mobile overlay out of the desktop three-column grid. */
.mobile-shade{display:none}
.mobile-side-btn{display:none}
@media(max-width:980px){
 .app{height:100dvh;min-height:0;grid-template-rows:auto minmax(0,1fr)}
 .top{min-height:56px;height:auto;flex-wrap:wrap;gap:6px;padding:8px 10px;align-content:center}
 .top .brand{font-size:14px;margin-right:auto}
 .top>.sp{display:none}
 .top .rng{font-size:13px;max-width:calc(100vw - 105px);overflow:hidden;text-overflow:ellipsis}
 .top .wkb{display:none}
 .top #seg-tab{order:8}.top #seg-zoom{order:9}
 .top .prof{margin-left:auto}.top .prof span:not(.av){display:none}
 .top .btn,.top .ic{flex:none}
 .mobile-side-btn{display:inline-grid;order:10}
 .body,.body.nav-off{position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
 .body .nav{position:absolute;inset:0 auto 0 0;width:min(310px,88vw);z-index:30;box-shadow:6px 0 24px #0002;transform:translateX(-110%);transition:transform .2s;visibility:hidden;overflow-y:auto;padding:14px 10px;border-right:1px solid var(--ln)}
 .body.mobile-nav-open .nav{transform:translateX(0);visibility:visible}
 .body.nav-off .nav{width:min(310px,88vw);padding:14px 10px;overflow-y:auto}
 .body .main{min-width:0;grid-column:1;grid-row:1}
 .body .side{position:absolute;right:0;top:0;bottom:0;width:min(360px,92vw);z-index:31;box-shadow:-6px 0 24px #0002;transform:translateX(110%);transition:transform .2s;visibility:hidden;overflow:auto}
 .body.mobile-side-open .side{transform:translateX(0);visibility:visible}
 .mobile-shade{display:none;position:absolute;inset:0;background:#0d0b1b63;z-index:25}
 .body.mobile-nav-open .mobile-shade,.body.mobile-side-open .mobile-shade{display:block}
 .cbar{padding:10px 12px 4px;flex-wrap:wrap;gap:6px}.cbar b{font-size:14px}
 .legend{margin-left:0;justify-content:flex-start;max-width:100%;overflow-x:auto;flex-wrap:nowrap}
 .calw{margin:8px 8px 12px;overflow:auto;overscroll-behavior:contain}
 .calw .cols{min-width:620px}.dc{min-width:120px}
 .gl-wrap{padding:8px 12px 20px}.gl-grid{grid-template-columns:minmax(0,1fr)}
 .gt-card{min-width:0}.gt-i{min-width:650px}.gt-card{overflow-x:auto}
 .gw{overflow:auto}.gh,.row{min-width:max-content}
 .modal{width:min(640px,100vw);max-height:95dvh;border-radius:14px}.mb{padding:14px}.mf{padding:10px 14px}
 .notp{max-width:calc(100vw - 20px);right:10px;top:68px}
 .login .card{width:min(360px,calc(100vw - 32px));padding:24px}
}
@media(max-width:520px){
 .top #b-today{padding:5px 8px}.top .rng{font-size:12px}
 .top #seg-tab{order:8;flex:1;justify-content:center}.top #seg-zoom{order:9;flex:1;min-width:190px}
 .top .prof{padding:3px}.top .prof .av{width:28px!important;height:28px!important}
 .top #b-noti{order:7}.top #b-side-mobile{order:10}
 .calw .cols{min-width:600px}
 .fg{grid-template-columns:78px minmax(0,1fr);gap:8px}
 .modal .ttl{font-size:17px}
}
/* Header mobile preview; iframe viewport triggers the actual responsive styles */
#b-mobile-preview{flex:none;display:inline-grid;place-items:center;color:#fff}#b-mobile-preview svg{display:block;stroke:#fff}
.phone-preview[hidden]{display:none!important}
.phone-preview{position:fixed;inset:0;z-index:200;background:#171424ed;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 16px 20px}
.phone-preview-top{width:min(100%,460px);display:flex;align-items:center;justify-content:space-between;gap:8px;color:white;font-size:13px}
.phone-preview-top button{background:#5140b8;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:10px 12px;font-weight:700;min-height:40px;display:inline-flex;align-items:center;gap:7px}.phone-preview-top button svg{stroke:#fff;flex:none}
.phone-preview-frame{flex:1;min-height:0;width:min(390px,100%);background:white;border:6px solid #565266;border-radius:26px;overflow:hidden;box-shadow:0 20px 50px #0007}
.phone-preview-frame iframe{width:100%;height:100%;border:0;background:#f4f3ef}
body.phone-preview-active{overflow:hidden}
@media(max-width:440px){.phone-preview{padding:8px 4px}.phone-preview-frame{width:100%;border-width:3px;border-radius:14px}}

/* Mobile home: weekly team schedule, not shown in desktop layout */
.mob-home{display:none}
@media(max-width:980px){

/* Restore the calendar task copy action in the modal footer. */
.task-modal-footer .task-footer-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px}
.task-modal-footer #m-copy{white-space:nowrap}
@media(max-width:480px){.task-modal-footer .task-footer-actions{gap:5px}.task-modal-footer #m-copy{padding-inline:9px}}

/* 상세 할 일별 메모 · 팀장 답글 · 검토 완료 */
#modal .todo-item{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:10px 11px!important;margin:7px 0;border:1px solid #eceaf4;border-radius:12px;background:#faf9fd}
#modal .todo-item .todo-text{flex:1;min-width:100px}
#modal .todo-item .todo-detail{width:100%;display:flex;flex-direction:column;gap:7px;padding:3px 0 1px 24px;min-width:0}
#modal .todo-memo,#modal .todo-leader-reply{width:100%;box-sizing:border-box;min-height:58px;max-height:100px;resize:vertical;border:1px solid #e8e6f0;border-radius:9px;background:#fff;color:#322d40;padding:9px 11px;font:inherit;font-size:12px;line-height:1.55}
#modal .todo-memo:focus,#modal .todo-leader-reply:focus{outline:2px solid #bdaee9;outline-offset:0}
#modal .todo-comment-label{font-size:11px;font-weight:700;color:#746e87;display:flex;gap:7px;align-items:center}
#modal .todo-leader-row{background:#f7f2ff;border:1px solid #e5ddfa;border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
#modal .todo-review-button{align-self:flex-start;border:1px solid #b9ade6;border-radius:100px;background:#fff;color:#5b46aa;font-weight:750;font-size:11px;padding:6px 10px;cursor:pointer}
#modal .todo-review-button[aria-pressed="true"]{background:#6550bf;color:white;border-color:#6550bf}
#modal .todo-review-button:disabled{cursor:default;opacity:.85}
#modal .todo-review-status{color:#6654a5;font-size:11px;font-weight:700}
#modal .todo-leader-save{align-self:flex-end;background:#6650c0;color:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:11px}
#modal .task-readonly-checkitem{align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #f0edf6}
#modal .task-readonly-checkitem>.todo-detail{flex-basis:100%;margin-left:24px}
#modal .task-readonly-checkitem .todo-detail{margin-top:7px;padding:0;width:100%}
#modal .todo-readonly-memo,#modal .todo-readonly-reply{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#49445c;line-height:1.55}
#modal .todo-readonly-memo{padding:7px 9px;border-radius:8px;background:#f8f7fa}
@media(max-width:520px){#modal .todo-item .todo-detail{padding-left:0}}


/* 타 팀원 상세 할 일 응원 스티커 */
#modal .todo-sticker-area{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:8px;vertical-align:middle;min-width:0}
#modal .todo-sticker-stack{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
#modal .todo-sticker-emoji{display:inline-flex;align-items:center;justify-content:center;width:28px;height:27px;border:1px solid #ece5f9;background:#fcfaff;border-radius:9px;font-size:17px;line-height:1;cursor:default}
#modal .todo-sticker-add{width:24px;height:24px;border:1px dashed #b8addb;color:#7159bc;background:#fff;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;font-size:16px;line-height:1}
#modal .todo-sticker-add:hover,#modal .todo-sticker-add[aria-expanded=true]{background:#f1ebff;border-color:#8a72d5}
#modal .todo-sticker-row{display:flex;align-items:center;min-width:0;gap:5px;flex-wrap:wrap}
#modal .todo-sticker-picker{display:none;flex-wrap:wrap;gap:5px;align-items:center;padding:7px;border:1px solid #ebe5f7;border-radius:10px;background:#fbfaff;margin-top:7px}
#modal .todo-sticker-picker.open{display:flex}
#modal .todo-sticker-choice{display:inline-flex;align-items:center;gap:3px;padding:4px 7px;border:1px solid #e7e0f3;border-radius:8px;background:#fff;color:#514568;cursor:pointer;font-size:11px}
#modal .todo-sticker-choice .st-emoji{font-size:17px}
#modal .todo-sticker-choice[aria-pressed=true]{background:#eee7ff;border-color:#8267c7;color:#5033a5;font-weight:700}
#modal .todo-sticker-choice:disabled{opacity:.5;cursor:wait}
#modal .task-readonly-checkitem>.todo-sticker-picker{flex-basis:100%;margin-left:24px}
#modal .todo-sticker-emoji[title]{cursor:help}


/* 상세 할 일 - 스티커 추가 아이콘 버튼 정렬 보완 */
#modal .task-readonly-checkitem{align-items:center}
#modal .todo-sticker-area{display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;flex:0 0 auto;flex-wrap:nowrap;margin-left:8px;vertical-align:middle;min-height:30px}
#modal .todo-sticker-stack{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
#modal .todo-sticker-emoji{box-sizing:border-box;width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
#modal .todo-sticker-add{appearance:none;box-sizing:border-box;position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;width:30px;height:30px;min-width:30px;min-height:30px;padding:0;margin:0;border:1px solid #b7a5e8;border-radius:9px;background:#f7f3ff;color:#684bbb;cursor:pointer;line-height:1;vertical-align:middle;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease}
#modal .todo-sticker-add-icon{display:block;flex:0 0 18px;width:18px;height:18px;pointer-events:none}
#modal .todo-sticker-add:hover,#modal .todo-sticker-add[aria-expanded="true"]{background:#eae1ff;border-color:#8061cb;color:#5338a2}
#modal .todo-sticker-add:focus-visible{outline:2px solid #7b5bd6;outline-offset:2px}
@media(max-width:520px){#modal .todo-sticker-area{margin-left:5px;gap:5px}#modal .todo-sticker-add{width:30px;height:30px;flex-basis:30px}}


/* 2026-10: 할 일 구분 선택 (기존 팝업 입력 요소와 일관된 레이아웃) */
.clean-task-form .task-type-label{display:block;margin:13px 0 6px;color:#555a73;font-size:12px;font-weight:700}
.clean-task-form .task-type-select{display:block;width:100%;min-width:0;max-width:100%;height:39px;padding:0 12px;border:1px solid #ddddeb;border-radius:10px;background:#f7f7fa;color:#26243a;font:inherit;font-size:13px;box-sizing:border-box;cursor:pointer}
.clean-task-form .task-type-select:focus{outline:2px solid #9180d4;outline-offset:1px}

/* 완료된 상세 할 일: 숨기지 않고 목록에 남기며 취소선·연한 색상 적용 */
#modal .todo-item.todo-is-done{background:#f5f5f8!important;border-color:#e8e8ee!important;opacity:.66;transition:background .18s,opacity .18s}
#modal .todo-item.todo-is-done .todo-text{text-decoration:line-through!important;text-decoration-color:#9696a4!important;color:#9393a0!important;background:transparent!important}
#modal .todo-item.todo-is-done .todo-detail{opacity:.86}
#modal .todo-item.todo-is-done .todo-check{accent-color:#9695ad}

/* Activity center: three tabs */
.notp{width:410px;max-width:calc(100vw - 20px);max-height:76vh;overflow:hidden;display:none;flex-direction:column}
.notp.show{display:flex}
.notp .notp-head{display:flex;align-items:center;gap:8px;padding:14px 15px 10px;background:#fff;flex-shrink:0}
.notp .notp-head b{font-size:14px;color:#29233b}
.notp .notp-head button{margin-left:auto;color:#7463b1;border:0;background:transparent;cursor:pointer}
.notp .log-tabs{display:flex;flex-shrink:0;border-bottom:1px solid #e8e6f0;padding:0 11px;gap:2px}
.notp .log-tabs button{border:0;background:none;cursor:pointer;min-height:41px;padding:0 11px;font-size:12px;font-weight:700;color:#868094;white-space:nowrap;border-bottom:2px solid transparent}
.notp .log-tabs button.active{color:#5946b6;border-bottom-color:#6258da}
.notp .log-tabs button:focus-visible{outline:2px solid #6258da;outline-offset:-4px}
.notp .log-content{min-height:80px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.notp .log-help{padding:11px 15px;background:#faf9fd;color:#7c7890;font-size:11px;line-height:1.5}
.notp .na{align-items:center;gap:10px;padding:11px 15px}
.notp .na>div:last-child{min-width:0;flex:1}
.notp .na .log-action{font-weight:700;color:#393448}
.notp .na small{font-size:11px}
.notp .log-empty{padding:32px 15px;text-align:center;font-size:12px;color:#89849a}
.notp .log-view{width:100%;border:0;background:none;padding:13px 15px;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid #f0eef5;color:#363144}
.notp .log-view:hover{background:#f7f4ff}
.notp .log-view>span:nth-child(2){flex:1;min-width:0}
.notp .log-view .log-view-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}
.notp .log-view small{display:block;margin-top:3px;color:#948fa2;font-size:10px}
@media(max-width:440px){.notp .log-tabs button{font-size:11px;padding:0 8px}.notp{right:10px}}

#modal .meeting-readonly small{font-size:11px;color:#817c92}

#modal .meeting-block{border-top:1px solid #f0edf5;padding-top:11px}
#modal .meeting-block p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6;margin:0}

async function reorderNav(kind,fromId,toId){

  if(!isLeader()){toast("팀원 순서 변경은 관리자만 할 수 있습니다",1);return}

  if(from<0||to<0)return;
  const [el]=list.splice(from,1);list.splice(to,0,el);
  const changes=list.map((m,i)=>({...m,sort:i+1}));
  if(!await Store.put("members",changes))return;

function bindNavReorder(){

    grip.addEventListener("click",e=>e.stopPropagation());
    grip.addEventListener("touchstart",e=>{const t=e.touches[0];touchSource={kind:el.dataset.reorder,id:el.dataset.orderId};touchDest=null;grip.classList.add("touch-moving")},{passive:true});

 });
}

<script id="dashboard-three-pill-logic">
(function(){
 const nav=document.getElementById('seg-tab'),panel=document.getElementById('budget-panel'),frame=document.getElementById('budget-embed');
 if(!nav||!panel||!frame)return;
 frame.srcdoc=document.getElementById('embedded-budget-source').textContent;
 let budgetPage='annual';
 const apply=(v)=>{
  const budget=v==='budget';document.body.classList.toggle('budget-mode',budget);
  panel.hidden=!budget;
  document.querySelectorAll('#seg-tab button[data-v]').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});
  document.querySelectorAll('#budget-subnav button').forEach(b=>b.classList.toggle('on',b.dataset.bpage===budgetPage));
  if(budget){try{frame.contentWindow.postMessage({type:'dashboard-budget-page',page:budgetPage},'*')}catch(e){}}
 };
 nav.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;
  if(b.dataset.v==='budget'){e.stopImmediatePropagation();localStorage.setItem('tb-mode','budget');apply('budget')}
  else{document.body.classList.remove('budget-mode');panel.hidden=true;setTimeout(()=>apply(b.dataset.v),0)}
 },true);
 document.getElementById('budget-subnav').addEventListener('click',e=>{const b=e.target.closest('button[data-bpage]');if(!b)return;budgetPage=b.dataset.bpage;apply('budget')});
 frame.addEventListener('load',()=>{if(document.body.classList.contains('budget-mode'))apply('budget')});
 if(localStorage.getItem('tb-mode')==='budget')apply('budget');
})();
</script>

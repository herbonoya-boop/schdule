<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 조직진단 디브리핑 일정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1c1c1e;--muted:#6b6f7e;--line:#e0e2e8;--bg:#f7f8fa;--blue:#4262ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Pretendard','Noto Sans KR',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.container{width:min(100%,540px);margin:auto;min-height:100vh;background:#fff;padding:25px 20px 35px}header{border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.6px}h1{font-size:22px;letter-spacing:-.7px;margin:9px 0}h2{font-size:20px;margin:5px 0 8px}p{margin:7px 0}.intro,.helper{color:#555a6a;font-size:13px}.helper{margin-bottom:18px}.info{background:var(--bg);border-radius:12px;padding:14px;margin:17px 0;font-size:12px}.info p{margin:6px 0}.info strong{display:inline-block;min-width:65px}.progress{height:4px;background:#eef0f3;border-radius:10px;margin:20px 0}.progress>div{height:100%;background:var(--ink);border-radius:10px;transition:width .2s}.caption{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}input,select{width:100%;height:44px;border:1px solid #c7cad5;border-radius:8px;background:white;padding:0 12px;color:var(--ink)}
.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 151px;gap:9px;align-items:start}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{font-size:11px;text-align:center;color:var(--muted);padding:6px 0}.day{height:38px;min-width:0;padding:0;background:white;border:1px solid var(--line);border-radius:7px;font-size:12px}.day:disabled{color:#b4b7c0;background:var(--bg);border-color:transparent;cursor:default}.day.active{background:#eef1ff;border:2px solid var(--blue);font-weight:600}.day.has-rank:after{content:'•';color:#4262ff;margin-left:2px}.times{border:1px solid var(--line);border-radius:11px;padding:9px;min-height:145px;animation:fadeIn .19s ease both}@keyframes fadeIn{from{opacity:0;transform:translateX(9px)}to{opacity:1;transform:translateX(0)}}.time-title{font-size:12px;font-weight:600;margin:0 0 6px}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.time{min-height:34px;background:#fff;border:1px solid var(--line);border-radius:7px;font-size:11px;padding:5px 1px}.time.taken{border:2px dashed #a5a8b5}.time.active{border:2px solid var(--blue);background:#eef1ff;font-weight:700}.time.previous{border:1px solid #b2b9d7;background:#f1f3fa;color:#29365f;font-weight:600}.time:disabled{cursor:default}.time small{font-size:9px;display:block}.legend{font-size:11px;color:var(--muted);margin-top:12px}.legend span{white-space:nowrap}.legend i{display:inline-block;width:10px;height:10px;border:2px dashed #a5a8b5;border-radius:3px;vertical-align:middle;margin-right:3px}.legend b{background:#edf0fb;color:#29365f;border-radius:3px;padding:2px 4px;font-size:10px}
.summary{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px}.summary-title{font-weight:600;font-size:13px}.summary-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef0f3;font-size:12px}.summary-row:last-child{border:0}.summary-row span:first-child{color:var(--muted);white-space:nowrap}.summary-row span:last-child{text-align:right}.actions{display:flex;gap:8px;margin-top:20px}.action{border:0;border-radius:999px;padding:13px 18px;font-size:14px}.primary{background:var(--ink);color:white;flex:1}.secondary{background:var(--bg);color:var(--ink)}.action:disabled{background:#e0e2e8;color:#a5a8b5;cursor:not-allowed}.notice{font-size:12px;color:var(--muted);margin-top:20px}.notice ul{padding-left:18px}.notice li{margin:5px 0}.error{color:#b42318;font-size:12px;margin-top:12px;overflow-wrap:anywhere}.complete{text-align:center;padding:28px 0}.check{height:58px;width:58px;border-radius:50%;display:grid;place-items:center;background:#e4f7ee;color:#00885a;font-size:30px;margin:0 auto 16px}@media(max-width:400px){.container{padding:20px 12px}.calendar-layout{grid-template-columns:minmax(0,1fr) 133px;gap:6px}.day{height:34px}.times{padding:6px}.time{font-size:10px}h1{font-size:20px}}
</style></head><body><main class="container">
<header><div class="eyebrow">DONG-A SOCIO GROUP · 2026</div><h1>2026 조직진단 디브리핑 일정</h1><p class="intro">2026년 8월에 실시한 동아쏘시오그룹 조직진단 결과를 보고드리고자 합니다.</p></header>
<section class="info"><p><strong>보고 목적</strong> 2026 동아쏘시오그룹 조직진단 결과 디브리핑</p><p><strong>보고 내용</strong> 조직진단 분석결과, 원인탐색결과, 개선활동 제안</p><p><strong>보고 시간</strong> 약 1시간 내외</p></section>
<div class="progress"><div id="progress" style="width:20%"></div></div><section id="content"></section><div id="actions" class="actions"><button id="back" class="action secondary" type="button">이전 단계</button><button id="next" class="action primary" type="button">다음 단계</button></div>
<section class="summary" id="summary"></section><section class="notice"><strong>참고사항</strong><ul><li>타사에는 회사명을 공개하지 않습니다.</li><li>점선으로 표기한 시간도 선택 가능하나, 추후에 조정이 있을 수 있습니다.</li><li>제출 후 일정 변경은 담당 관리자에게 요청해 주시기 바랍니다.</li></ul></section>
</main><script>
'use strict';
const SUPABASE_URL='https://evrawzvpnpoycknoadbq.supabase.co';
const SUPABASE_KEY='sb_publishable_kQL9FANhvvov8t-nwG6sOw_F57tItPP';
const COMPANIES=['동아제약','동아에스티','비티젠','에스티팜','동아 오츠카','용마로지스','동아참메드','동아 에코팩','한국신동공업','아벤종합건설','앱티스'];
const TIMES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'debrief-company-2026-auth'}});
const $=id=>document.getElementById(id);
const state={step:0,company:'',code:'',day:null,picks:[null,null,null],occupied:new Set(),ready:false,busy:false,completed:false,error:''};
const weekdays=['일','월','화','수','목','금','토'];
const valid=d=>d>=2&&d<=20&&![0,6].includes(new Date(2026,10,d).getDay());
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(p){return p?`11월 ${p.day}일 (${weekdays[new Date(2026,10,p.day).getDay()]}) · ${p.time}`:'미선택'}
function summary(){ $('summary').innerHTML='<div class="summary-title">응답 현황</div>'+`<div class="summary-row"><span>회사명</span><span>${esc(state.company||'미선택')}</span></div>`+state.picks.map((p,i)=>`<div class="summary-row"><span>${i+1}순위</span><span>${esc(fmt(p))}</span></div>`).join('') }
function dayCalendar(){let s='<div class="calendar">'+weekdays.map(w=>`<div class="weekday">${w}</div>`).join('');for(let d=1;d<=35;d++){if(d>30){s+='<div></div>';continue}const marker=state.picks.some((p,i)=>i<state.step-1&&p?.day===d);s+=`<button type="button" class="day ${d===state.day?'active':''} ${marker?'has-rank':''}" data-day="${d}" ${valid(d)?'':'disabled'} aria-label="11월 ${d}일">${d}</button>`}return s+'</div>'}
function timePanel(){if(!state.day)return '<div class="times"><p class="time-title">시간 선택</p><p class="caption">날짜를 선택하면 이곳에 시간이 나타납니다.</p></div>';const rankIndex=state.step-1;return `<div class="times" key="${state.day}"><p class="time-title">11월 ${state.day}일</p><div class="time-grid">${TIMES.map(t=>{const prev=state.picks.findIndex((p,i)=>i!==rankIndex&&p?.day===state.day&&p?.time===t);const mine=state.picks[rankIndex]?.day===state.day&&state.picks[rankIndex]?.time===t;const taken=state.occupied.has(`${state.day}|${t}`);return `<button type="button" data-time="${t}" class="time ${mine?'active':''} ${prev>=0?'previous':''} ${taken?'taken':''}" ${prev>=0?'disabled title="다른 순위에서 선택한 시간"':''}>${prev>=0?`<small>${prev+1}순위</small>`:t}${mine?'<small>선택</small>':''}</button>`}).join('')}</div></div>`}
function render(){const {step,completed,busy}=state;$('progress').style.width=`${(step+1)*20}%`;let h='';if(completed){h='<div class="complete" role="status"><div class="check">✓</div><h2>회신이 완료되었습니다.</h2><p class="helper">희망 일정이 정상적으로 저장되었습니다.<br>변경이 필요한 경우 담당 관리자에게 문의해 주세요.</p></div>'}
else if(step===0){h=`<div class="caption">STEP 01 / 05</div><h2>회사를 선택해 주세요.</h2><p class="helper">회사명과 숫자 4자리 인증코드를 입력해 주세요.</p><label for="company">회사명</label><select id="company"><option value="">회사를 선택해 주세요</option>${COMPANIES.map(c=>`<option value="${esc(c)}" ${c===state.company?'selected':''}>${esc(c)}</option>`).join('')}</select><label for="code">인증코드</label><input id="code" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="숫자 4자리" value="${esc(state.code)}"><p class="caption">회사별로 전달받은 인증코드를 입력해 주세요.</p>`}
else if(step<=3){h=`<div class="caption">STEP 0${step+1} / 05</div><h2>${step}순위 일정과 시간을 선택해 주세요.</h2><p class="helper">날짜를 누르면 오른쪽에 해당 날짜의 시간이 표시됩니다.</p><div class="calendar-layout">${dayCalendar()}${timePanel()}</div><div class="legend"><span><i></i>타사 선택 시간</span>　<span><b>1·2순위</b> 내가 앞서 선택한 시간</span></div>`}
else{h='<div class="caption">STEP 05 / 05</div><h2>회신 내용을 확인해 주세요.</h2><p class="helper">제출 후 직접 수정할 수 없습니다. 선택하신 세 가지 일정을 확인해 주세요.</p>'}
if(state.error)h+=`<p class="error" role="alert">${esc(state.error)}</p>`;$('content').innerHTML=h;$('actions').style.display=completed?'none':'flex';$('back').style.display=step===0?'none':'inline-block';$('next').textContent=busy?'처리 중...':step===0?'인증하고 시작하기':step<=3?(state.picks[step-1]?`${step}순위 선택완료`:'날짜와 시간을 선택해 주세요'):'회신 제출';$('next').disabled=busy||!state.ready||(step===0?(!state.company||!/^[0-9]{4}$/.test(state.code)):step<=3?!state.picks[step-1]:false);
if(step===0&&!completed){$('company').onchange=e=>{state.company=e.target.value;state.code='';state.picks=[null,null,null];state.error='';render()};$('code').oninput=e=>{state.code=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=state.code;$('next').disabled=!state.ready||!state.company||state.code.length!==4}}
document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{state.day=Number(el.dataset.day);state.error='';render()});document.querySelectorAll('[data-time]').forEach(el=>el.onclick=()=>{const time=el.dataset.time;if(state.picks.some((p,i)=>i!==state.step-1&&p?.day===state.day&&p?.time===time))return;state.picks[state.step-1]={day:state.day,time};state.error='';render()});summary()}
async function refreshOccupied(){if(!state.ready)return;try{const {data,error}=await db.rpc('occupied_slots');if(error)throw error;state.occupied=new Set((data||[]).map(x=>`${Number(x.day)}|${String(x.slot_time).slice(0,5)}`));if(state.step>=1&&state.step<=3&&!state.completed)render()}catch(e){console.warn('타사 일정 조회 실패:',e.message)}}
async function next(){if(state.busy||state.completed||!state.ready)return;state.error='';if(state.step===0){if(!state.company||state.code.length!==4)return;state.busy=true;render();try{const {data,error}=await db.rpc('verify_debrief_invite',{p_company:state.company,p_code:state.code});if(error)throw error;if(data!=='ok')throw Error(data==='already_submitted'?'이미 제출이 완료된 회사입니다. 변경은 관리자에게 문의해 주세요.':data==='invalid_code'?'회사명 또는 인증코드가 올바르지 않습니다.':'인증 실패: '+data);state.step=1;state.day=null;await refreshOccupied()}catch(e){state.error=e.message}finally{state.busy=false;render()}return}
if(state.step<=3){if(!state.picks[state.step-1])return;state.step++;state.day=state.step<=3?state.picks[state.step-1]?.day??null:null;render();return}
state.busy=true;render();try{const {data,error}=await db.rpc('submit_debrief_invite',{p_company:state.company,p_code:state.code,p_picks:state.picks});if(error)throw error;if(data!=='ok')throw Error(data==='already_submitted'?'이미 제출된 회사입니다.':data==='invalid_code'?'인증코드가 올바르지 않습니다.':data==='account_already_submitted'?'이미 제출에 사용된 계정입니다.':data==='invalid_schedule'?'세 순위의 일정이 올바른지 확인해 주세요.':'제출 실패: '+data);state.completed=true;state.code=''}catch(e){state.error=e.message}finally{state.busy=false;render()}}
$('next').onclick=next;$('back').onclick=()=>{if(state.step>0&&!state.busy){state.step--;state.day=state.step>=1&&state.step<=3?state.picks[state.step-1]?.day??null:null;state.error='';render()}};
async function init(){
  render();
  try {
    const {data,error}=await db.auth.getSession();
    if(error) throw error;
    let session=data.session;
    if(session){
      // Previously submitted sessions should not force a completion screen
      // on a shared device or on return visits.
      const previous=await db.from('debrief_responses')
        .select('user_id')
        .eq('user_id',session.user.id)
        .maybeSingle();
      if(previous.error) throw previous.error;
      if(previous.data){
        const signedOut=await db.auth.signOut();
        if(signedOut.error) throw signedOut.error;
        session=null;
      }
    }
    if(!session){
      const signedIn=await db.auth.signInAnonymously();
      if(signedIn.error) throw signedIn.error;
      session=signedIn.data.session;
    }
    if(!session) throw Error('로그인 세션을 생성하지 못했습니다.');
    state.completed=false;
    state.step=0;
    state.company='';
    state.code='';
    state.picks=[null,null,null];
    state.day=null;
    state.ready=true;
    await refreshOccupied();
  }catch(e){
    state.error='서버 연결 오류: '+e.message;
    console.error(e);
  }
  render();
}
init();setInterval(refreshOccupied,12000);
</script></body></html>
